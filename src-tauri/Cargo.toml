[package]
name = "opencode-desktop"
version = "1.1.7"
description = "The OpenCode coding agent - Tauri port"
authors = ["OpenCode"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opencode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
dirs = "6"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "time"] }
url = "2"
log = "0.4"
base64 = "0.22"
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
simplelog = "0.12"
tar = "0.4"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
